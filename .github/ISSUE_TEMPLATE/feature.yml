name: Feature request
description: A new capability you want or an improvement to something that exists
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve and what you would like su to do.
  - type: textarea
    id: problem
    attributes:
      label: What is missing now
      placeholder: "For example: restoring a full backup means reinstalling the Linux environment from scratch."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      placeholder: "For example: recognize the installed Debian right after importing a full backup."
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Reference screenshots and how other apps handle it are both welcome.
    validations:
      required: false
