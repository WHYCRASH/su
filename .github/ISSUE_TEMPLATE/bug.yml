name: Bug report
description: Broken behavior, crashes, or anything different from expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report a problem with su. Please search for a similar issue before filing.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected versus what actually happened.
      placeholder: "For example: tapping send spins forever, then the app crashes."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Write it as steps if you can.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version in Settings → About, or the APK file name, e.g. 5.2.8.
      placeholder: 5.2.8
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      description: Model and Android / ColorOS / HyperOS version. Mention root or LSPosed if applicable.
      placeholder: For example, OnePlus 12 · ColorOS 15 · rooted
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Logs, screenshots, and screen recordings are all welcome. You can export diagnostics logs from Settings.
    validations:
      required: false
